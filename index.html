<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hexlet Frontend Project</title>
  <script type="module" src="/src/main.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">
  <main class="flex-grow-1">
    <section class="container-fluid bg-gradient p-5">
      <div class="row">
        <div class="col-md-10 col-lg-8 mx-auto text-white">
          <h1>RSS агрегатор</h1>
          <p>Начните читать RSS сегодня! Это легко, это красиво.</p>
          <form action >
            <div class="row">
              <div class="col">
                <div class="form-floating">
                  <input id="url-input" autofocus type="text" required name="url" placeholder="ссылка RSS" autocomplete="off">
                  <label for="url-input">Ссылка RSS</label>
                </div>
              </div>
              <div class="col-auto">
                <button type="submit">Добавить</button>
              </div>
            </div>
          </form>
          <p id="example">Пример: </p>
          <p class="feedback"></p>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
